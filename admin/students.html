<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students — SRHP Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>

  <div class="admin-main">
    <div class="admin-topbar" id="adminTopbar"></div>

    <div class="admin-content">
      <div class="admin-page-head">
        <div>
          <h1>Students</h1>
          <p class="admin-page-sub" id="pageSub"></p>
        </div>
      </div>

      <div class="admin-toolbar">
        <input type="search" id="studentSearch" placeholder="Search by name or institution">
        <select id="stateFilter"><option value="">All states</option></select>
        <select id="levelFilter">
          <option value="">All levels</option>
          <option>100 Level</option><option>200 Level</option><option>300 Level</option>
          <option>400 Level</option><option>500 Level</option><option>Postgraduate</option><option>Graduate</option>
        </select>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr><th>Name</th><th>State</th><th>Institution</th><th>Level</th><th>Registered</th><th>Cards</th><th>Community</th></tr>
          </thead>
          <tbody id="studentsBody"></tbody>
        </table>
      </div>

      <div class="admin-pagination">
        <span id="paginationInfo"></span>
        <div class="admin-pagination-btns">
          <button id="prevPage">Previous</button>
          <button id="nextPage">Next</button>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="admin-drawer-overlay" id="studentDrawer" hidden>
  <div class="admin-drawer">
    <button class="admin-drawer-close" id="drawerClose">&times;</button>
    <div id="drawerContent"></div>
  </div>
</div>

<script src="../js/mock-data.js"></script>
<script src="../js/api-config.js"></script>
<script src="../js/live-data.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-data.js"></script>
<script src="js/students.js"></script>
</body>
</html>
