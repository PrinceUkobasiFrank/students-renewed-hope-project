<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News — SRHP Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>

  <div class="admin-main">
    <div class="admin-topbar" id="adminTopbar"></div>

    <div class="admin-content">
      <div class="admin-page-head">
        <div>
          <h1>News</h1>
          <p class="admin-page-sub">Create and manage updates shown on the public site.</p>
        </div>
        <button class="btn btn-accent" id="newPostBtn">New update</button>
      </div>

      <form class="admin-news-form" id="newsForm" hidden>
        <h2 style="font-size:1.15rem;margin-top:0;" id="newsFormTitle">New update</h2>
        <input type="hidden" id="newsEditId">
        <div class="field">
          <label for="newsTitle">Title</label>
          <input type="text" id="newsTitle" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="newsCategory">Category</label>
            <select id="newsCategory">
              <option value="community">Community</option>
              <option value="product">Product</option>
              <option value="policy">Policy</option>
            </select>
          </div>
          <div class="field">
            <label for="newsStatus">Status</label>
            <select id="newsStatus">
              <option value="published">Published</option>
              <option value="draft">Draft</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="newsExcerpt">Excerpt</label>
          <textarea id="newsExcerpt" rows="2" required></textarea>
        </div>
        <div class="field">
          <label for="newsBody">Body</label>
          <textarea id="newsBody" rows="4" required></textarea>
        </div>
        <p class="form-error" id="newsFormError" hidden></p>
        <div class="field-actions">
          <button type="button" class="btn btn-ghost" id="cancelNewsForm">Cancel</button>
          <button type="submit" class="btn btn-accent">Save update</button>
        </div>
      </form>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>Title</th><th>Category</th><th>Status</th><th>Published</th><th></th></tr></thead>
          <tbody id="newsBody_"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<script src="../js/mock-data.js"></script>
<script src="../js/api-config.js"></script>
<script src="../js/live-data.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-data.js"></script>
<script src="js/news-admin.js"></script>
</body>
</html>
