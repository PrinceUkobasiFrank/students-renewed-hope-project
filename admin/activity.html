<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity — SRHP Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>

  <div class="admin-main">
    <div class="admin-topbar" id="adminTopbar"></div>

    <div class="admin-content">
      <div class="admin-page-head">
        <div>
          <h1>Activity</h1>
          <p class="admin-page-sub">A live feed of what's happening across the platform.</p>
        </div>
      </div>

      <div class="admin-toolbar">
        <input type="search" id="activitySearch" placeholder="Search by name or state">
        <select id="typeFilter">
          <option value="">All event types</option>
          <option value="student_registered">Registrations</option>
          <option value="card_generated">Cards generated</option>
          <option value="card_shared">Cards shared</option>
          <option value="community_clicked">Community joins</option>
          <option value="news_viewed">News views</option>
        </select>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>Event</th><th>State</th><th>When</th></tr></thead>
          <tbody id="activityBody"></tbody>
        </table>
      </div>

      <div class="admin-pagination">
        <span id="paginationInfo"></span>
        <div class="admin-pagination-btns">
          <button id="prevPage">Previous</button>
          <button id="nextPage">Next</button>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../js/mock-data.js"></script>
<script src="../js/api-config.js"></script>
<script src="../js/live-data.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-data.js"></script>
<script src="js/activity.js"></script>
</body>
</html>
